name: Windows release validation
on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to validate; latest selects the current public release
        required: true
        default: latest
      legacy_release:
        description: Previous release for upgrade validation; latest uses the current public release
        required: true
        default: latest
env:
  GOMAXPROCS: '4'
  GOFLAGS: '-p=4'
permissions:
  contents: read
jobs:
  backend:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Go backend and Windows platform tests
        shell: pwsh
        run: |
          go test -timeout 12m ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test -tags desktop,production -timeout 5m .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native Windows system proxy and update routing
        env:
          DENGSHELL_TEST_SYSTEM_PROXY: 1
          GOMAXPROCS: 4
          GOFLAGS: -p=4
        run: go test -race -v -timeout 3m ./internal/updateproxy
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    permissions:
      contents: write # Draft releases require push access even when only downloading.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download exact release artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          QA_RELEASE: ${{ inputs.release || 'latest' }}
          QA_LEGACY: ${{ inputs.legacy_release || 'latest' }}
        run: |
          New-Item -ItemType Directory -Force qa-artifacts,qa-legacy | Out-Null
          if ($env:QA_RELEASE -eq 'latest' -or $env:QA_LEGACY -eq 'latest') {
            $publishedRelease = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($publishedRelease)) { throw 'Unable to resolve the current published release' }
            if ($env:QA_RELEASE -eq 'latest') { $env:QA_RELEASE = $publishedRelease.Trim() }
            if ($env:QA_LEGACY -eq 'latest') { $env:QA_LEGACY = $publishedRelease.Trim() }
          }
          "QA_LEGACY=$env:QA_LEGACY" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          gh release download $env:QA_RELEASE --pattern DengShell-Setup-x64.exe --pattern DengShell-windows-x64.zip --dir qa-artifacts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release download $env:QA_LEGACY --pattern DengShell-windows-x64.zip --dir qa-legacy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Native launch, installer and restart after update
        shell: pwsh
        run: ./scripts/test-windows-release.ps1 -Artifacts qa-artifacts -LegacyZip qa-legacy/DengShell-windows-x64.zip -Output qa-results -LegacyRelease $env:QA_LEGACY
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-validation
          path: qa-results
          retention-days: 14
